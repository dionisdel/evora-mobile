name: evora_mobile
description: App móvil Evora para instaladores - Búsqueda de farmacias y cuestionarios
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # State management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^14.0.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Location
  geolocator: ^12.0.0

  # Image
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0

  # Maps / URL
  url_launcher: ^6.2.0

  # Utils
  uuid: ^4.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
